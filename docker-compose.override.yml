x-pipeline-airflow: &pipeline-airflow
  env_file:
    - path: .aws/airflow.env
      required: false
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: ${KAFKA_TOPIC:-windows-events}
    KAFKA_CONSUMER_GROUP: airflow-windows-events
    EVENT_SQLITE_PATH: /usr/local/airflow/data/events.db
    PIPELINE_CONFIG: "{}"
    AIRFLOW__CORE__PARALLELISM: "4"

  networks:
    - airflow
    - pipeline
  volumes:
    - event_data:/usr/local/airflow/data

services:
  scheduler:
    <<: *pipeline-airflow
  api-server:
    <<: *pipeline-airflow
  dag-processor:
    <<: *pipeline-airflow
  triggerer:
    <<: *pipeline-airflow

networks:
  pipeline:
    external: true
    name: kafka-airflow_default

volumes:
  # Stable names preserve Astro history and logs when the checkout is moved.
  # Replace the generated definition to remove its incompatible driver setting.
  postgres_data: !override
    external: true
    name: kafka-airflow_astro_postgres_data
  airflow_logs: !override
    external: true
    name: kafka-airflow_astro_airflow_logs
  event_data:
    external: true
    name: kafka-airflow_event_data
