[project]
name = "kafka-airflow-events"
version = "0.3.0"
description = "Airflow orchestrated Kafka streaming and Airbnb bronze, silver, gold analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-airflow==3.3.2",
    "apache-airflow-providers-standard>=1.0,<2",
    "confluent-kafka==2.8.2",
    "apache-airflow-providers-duckdb==0.2.1",
    "apache-airflow-providers-amazon==9.39.0",
    "duckdb==1.3.2",
    "polars==1.34.0",
    "httpx==0.28.1",
    "clickhouse-connect==1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "moto[s3]>=5.1,<6"]
aws = ["boto3>=1.36,<2"]

[tool.pytest.ini_options]
pythonpath = ["dags", "include"]
testpaths = ["tests"]
