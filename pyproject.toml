[project]
name = "kafka-flink-airflow-pipeline"
version = "0.3.0"
description = "Synthetic TCP events through Flink and Kafka into bounded Airflow batches"
requires-python = ">=3.12,<3.15"
dependencies = [
    "apache-airflow==3.3.2",
    "apache-airflow-providers-standard>=1.0,<2",
    "apache-airflow-providers-apache-kafka==2.1.0",
    "apache-airflow-providers-common-messaging==2.1.2",
    "confluent-kafka==2.8.2",
    "pyarrow==26.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["include", "dags"]
testpaths = ["tests"]
