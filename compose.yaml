name: kafka-airflow

services:
  kafka:
    image: docker.io/apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"]
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: docker.io/apache/kafka:3.9.1
    entrypoint: /bin/bash
    command: ["-ec", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $${KAFKA_TOPIC} --partitions 1 --replication-factor 1"]
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-windows-events}
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    image: localhost/kafka-event-producer:dev
    build:
      context: .
      dockerfile: containers/producer.Containerfile
    environment:
      EVENT_INTERVAL_MS: ${EVENT_INTERVAL_MS:-100}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9999; read -r -t 3 line <&3; test -n \"$$line\"'"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jobmanager:
    image: localhost/kafka-event-flink:dev
    build:
      context: .
      dockerfile: containers/flink.Containerfile
    command: ["standalone-job", "--job-classname", "com.example.DataConsumerFlink", "--hostname", "producer", "--port", "9999", "--kafka-brokers", "kafka:9092", "--kafka-topic", "${KAFKA_TOPIC:-windows-events}"]
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        taskmanager.numberOfTaskSlots: 1
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1024m
        rest.bind-address: 0.0.0.0
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 100
        restart-strategy.fixed-delay.delay: 5s
    ports: ["127.0.0.1:${FLINK_UI_PORT:-8081}:8081"]
    depends_on:
      producer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  taskmanager:
    image: localhost/kafka-event-flink:dev
    command: taskmanager
    environment: *flink-env
    depends_on:
      jobmanager:
        condition: service_healthy
    restart: unless-stopped


volumes:
  kafka_data:
